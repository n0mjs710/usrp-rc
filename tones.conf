# usrp-rc tone catalog -- classic repeater-controller courtesy tones (ACC RC-*
# and others), from a well-known reference list of frequency/duration specs.
#
# Every tone here can be used by name from your config, e.g.
#     ct_link_on_message = yellow_jacket
# Don't edit this file: it's replaced on upgrade. To change a tone or make your
# own, add it under [messages] in usrp-rc.conf in the same format. Using a name
# from this list replaces the catalog's version.
#
# How to read a tone:
#     660:50         660 Hz for 50 ms
#     500+700:100    500 Hz and 700 Hz together for 100 ms
#     _30            30 ms of silence
#     1200:60@0.9    played at level 0.9 instead of audio.tone_level
# Notes play left to right.
#
# Lower frequencies sound deeper, and under about 50 ms a note is more of a
# click or chirp than a pitch. The "640ms delay from squelch closure to 1st
# tone" several of these specs call for is timers.ct_delay = 0.64.

[messages]

# ── One note or chord ─────────────────────────────────────────────────────
honk        = tone: 500+700:100    # short, low two-note horn
beep        = tone: 880:100        # plain high beep
boop        = tone: 440:100        # plain low beep
bloop       = tone: 840+500:100    # short two-note blend
piano_chord = tone: 660+880:100    # short, bright chord
rolm        = tone: 525+660:150    # longer, soft chord
quindar_on  = tone: 2525:250       # Apollo-style high tone, start of a transmission
quindar_off = tone: 2475:250       # Apollo-style high tone, end of a transmission

# ── Rising ────────────────────────────────────────────────────────────────
yellow_jacket = tone: 330:50 495:50 660:50       # three quick rising notes
bumble_bee    = tone: 330:100 495:100 660:100    # same notes as yellow_jacket, twice as slow
ascending     = tone: 500:50 750:50 1000:50      # three quick rising notes, higher
comet         = tone: 500:100 500:100 750:100    # two low notes, then a higher one
stardust      = tone: 750:125 880:80 880+1200:80 # rising, ending on a bright chord

# ── Falling ───────────────────────────────────────────────────────────────
descending    = tone: 1000:50 750:50 500:50      # three quick falling notes
hornet        = tone: 660:50 500:50 385:50       # three quick falling notes, lower
wasp          = tone: 660:100 500:100 385:100    # same notes as hornet, twice as slow
tumbleweed    = tone: 1000:20 800:20 600:20      # very fast falling chirp
shooting_star = tone: 800:100 800:100 540:100    # two notes, then a lower one
doorbell      = tone: 800:75 400:50              # ding-dong
doorbell_chord = tone: 1450+725:75 725+360:50    # ding-dong in octave chords

# ── Up and down ───────────────────────────────────────────────────────────
fire_fly    = tone: 1000+1200:120 1200+1400:80 600+800:100     # chord rises, then drops low
moonbounce  = tone: 1000+800:50 800:50 600:50 1500:50          # falls, then jumps high
chirp_chomp = tone: 1500:20 1250:20 1000:20 750:20 500:20 2550:20 # very fast fall, then a high blip
dunce_cap   = tone: 440+500:200 440+350:200                    # two long, low chords, falling

# ── Repeated, with gaps ───────────────────────────────────────────────────
nextel_beep         = tone: 1760:30 _30 1760:30 _30 1760:30    # three quick high chirps
function_complete   = tone: 480+1200:40 _40 480+1200:40        # two quick two-note chirps
function_complete_2 = tone: 900:60 _60 900:60                  # two quick beeps

# ── Warnings ──────────────────────────────────────────────────────────────
timeout_warn = tone: 1200:60@0.9 _20 1000:60@0.9 _20 800:60@0.9  # loud, three falling notes
