# Converted from TOML by toml2conf.py. Run: usrp-rc --check <this file>

access_mode = cor

[log]
level = debug

[mmdvm]
local_port = 4810
rpt_port = 3810

[link]
enabled = true
remote_host = 127.0.0.1
codec = opus

[audio]
master_gain = 0.75
voice_filter = false

[timers]
hang = 2.5

[events]
startup_message =
initial_ids = site_voice site_cw
mandatory_ids = site_cw
ct_message = yellow_jacket
ct_link_message = my_tone

[messages]
site_voice = voice: THISIS _ W ONE _400 REPEATER
site_cw = cw: W1XYZ/R DE W1XYZ
honk = tone: 500+800:100
my_tone = tone: 1000:80@0.8 _30 800:40
mixed = voice: REPEATER | tone: 700:50 900:50 | cw: ID
